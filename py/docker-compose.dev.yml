# Local development — starts PostgreSQL only.
# The API runs on the host for hot-reload:
#
#   cp .env.example .env   # edit PG_* vars if needed
#   uv run alembic upgrade head
#   uv run uvicorn telehealth.app.main:create_app --factory --reload

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: patient_portal_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patient_portal_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_dev_data:

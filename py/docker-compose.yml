services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telehealth}
      POSTGRES_USER: ${POSTGRES_USER:-telehealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-telehealth} -d ${POSTGRES_DB:-telehealth}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      ENVIRONMENT: production
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-telehealth}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-telehealth}
      VIDEO_SESSION_SECRET: ${VIDEO_SESSION_SECRET:?VIDEO_SESSION_SECRET is required}
      VIDEO_SESSION_EXPIRY_MINUTES: ${VIDEO_SESSION_EXPIRY_MINUTES:-90}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

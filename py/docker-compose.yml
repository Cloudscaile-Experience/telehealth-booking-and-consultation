services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-patient_portal_dev}
      POSTGRES_USER: ${PG_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${PG_USERNAME:-postgres} -d ${PG_DATABASE:-patient_portal_dev}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      ENVIRONMENT: production
      PORT: 8000
      HOST: 0.0.0.0
      PG_HOST: db
      PG_PORT: 5432
      PG_USERNAME: ${PG_USERNAME:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      PG_DATABASE: ${PG_DATABASE:-patient_portal_dev}
      VIDEO_SESSION_SECRET: ${VIDEO_SESSION_SECRET:-VIDEO_SESSION_SECRET}
      VIDEO_SESSION_EXPIRY_MINUTES: ${VIDEO_SESSION_EXPIRY_MINUTES:-90}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

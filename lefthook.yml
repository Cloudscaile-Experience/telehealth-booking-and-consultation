# Lefthook — git hook configuration for the telehealth monorepo
# Docs: https://lefthook.dev/configuration/
#
# Web hooks: run automatically via npm install inside web/.
# Python hooks: managed via pre-commit inside py/.
#   Install: cd py && uv run pre-commit install
#   Run manually: cd py && uv run pre-commit run --all-files

pre-commit:
  parallel: true
  jobs:
    # ── Web (React micro-frontend) ─────────────────────────────────────────────
    - name: web — biome lint + format
      root: "web/"
      glob: "*.{ts,tsx,js,jsx,json}"
      run: npx @biomejs/biome check --write {staged_files}
      stage_fixed: true

    - name: web — typescript
      root: "web/"
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit

    # ── Python backend ─────────────────────────────────────────────────────────
    - name: py — black (format)
      root: "py/"
      glob: "*.py"
      run: uv run black {staged_files}
      stage_fixed: true

    - name: py — isort (imports)
      root: "py/"
      glob: "*.py"
      run: uv run isort {staged_files}
      stage_fixed: true

    - name: py — ruff (lint + fix)
      root: "py/"
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true

    - name: py — mypy (types)
      root: "py/"
      glob: "*.py"
      run: uv run mypy {staged_files} --ignore-missing-imports

pre-push:
  jobs:
    # ── Python unit tests (run on push) ───────────────────────────────────────
    - name: py — pytest unit
      root: "py/"
      glob: "*.py"
      run: uv run pytest tests/unit -v --tb=short -q
